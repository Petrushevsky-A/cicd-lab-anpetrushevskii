name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository (step a)
        uses: actions/checkout@v4
      - name: Set up Python 3.12 (step b)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies (step c)
        run: pip install -r app/requirements.txt
      - name: Run tests (step d)
        run: pytest app/tests -v

